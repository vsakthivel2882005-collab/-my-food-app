
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Foodie Express | Online Food Ordering</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #e5b94f;
  --dark: #101010;
  --card: #1b1b1b;
  --text: #ffffff;
  --muted: #aaaaaa;
}

body {
  background: var(--dark);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input, textarea {
  font: inherit;
}

header {
  background: #181818;
  padding: 16px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #383838;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: var(--gold);
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  min-height: 340px;
  padding: 75px 7%;
  display: flex;
  align-items: center;
  background:
    linear-gradient(90deg, #000000e8, #00000066),
    url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1400")
    center/cover;
}

.hero h1 {
  font-size: clamp(34px, 6vw, 55px);
  margin-bottom: 15px;
}

.hero h1 span {
  color: var(--gold);
}

.hero p {
  color: #dddddd;
  margin-bottom: 25px;
}

.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  background: var(--gold);
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

.container {
  width: 90%;
  max-width: 1200px;
  margin: auto;
}

section {
  padding: 45px 0;
}

.section-title {
  font-size: 28px;
  margin-bottom: 25px;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search-box input {
  width: 100%;
  padding: 13px;
  background: #222;
  border: 1px solid #444;
  border-radius: 7px;
  color: white;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.category-btn {
  padding: 9px 16px;
  border: 1px solid #555;
  border-radius: 20px;
  color: white;
  background: #222;
  cursor: pointer;
}

.category-btn.active {
  background: var(--gold);
  color: black;
  border-color: var(--gold);
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
}

.food-card {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
  transition: .2s;
}

.food-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
}

.food-card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
}

.food-info {
  padding: 17px;
}

.food-info h3 {
  margin-bottom: 8px;
}

.food-info p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 12px;
}

.food-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.price {
  color: var(--gold);
  font-weight: bold;
  font-size: 19px;
}

.add-btn {
  background: var(--gold);
  border: none;
  padding: 9px 13px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

.cart-section {
  background: #181818;
  border-top: 1px solid #333;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #383838;
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty-controls button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 4px;
  background: var(--gold);
  cursor: pointer;
}

.total {
  font-size: 23px;
  color: var(--gold);
  margin-top: 20px;
  text-align: right;
}

.checkout {
  background: var(--card);
  padding: 22px;
  border-radius: 10px;
  margin-top: 25px;
}

.checkout input,
.checkout textarea {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  background: #252525;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
}

.checkout textarea {
  min-height: 80px;
  resize: vertical;
}

.whatsapp-btn {
  width: 100%;
  padding: 15px;
  background: #25d366;
  border: none;
  border-radius: 7px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.empty {
  color: var(--muted);
  padding: 15px 0;
}

footer {
  text-align: center;
  padding: 25px;
  color: var(--muted);
  border-top: 1px solid #333;
}

@media(max-width:600px) {
  header {
    padding: 14px 5%;
  }

  nav a {
    margin-left: 8px;
    font-size: 12px;
  }

  .hero {
    min-height: 300px;
    padding: 50px 6%;
  }

  .food-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .food-card img {
    height: 125px;
  }

  .food-info {
    padding: 12px;
  }

  .food-info h3 {
    font-size: 15px;
  }

  .price {
    font-size: 16px;
  }

  .add-btn {
    padding: 8px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍽 Foodie Express</div>
  <nav>
    <a href="#menu">Menu</a>
    <a href="#cart">Cart 🛒</a>
  </nav>
</header>

<section class="hero">
  <div>
    <h1>Delicious Food.<br><span>Delivered Fresh.</span></h1>
    <p>Order your favourite food from our menu.</p>
    <a href="#menu">
      <button class="btn">Order Now</button>
    </a>
  </div>
</section>

<section id="menu">
  <div class="container">
    <h2 class="section-title">Our Food Menu</h2>

    <div class="search-box">
      <input
        type="search"
        id="search"
        placeholder="Search food..."
        oninput="renderFoods()">
    </div>

    <div class="categories" id="categories"></div>

    <div class="food-grid" id="foodGrid"></div>
  </div>
</section>

<section class="cart-section" id="cart">
  <div class="container">
    <h2 class="section-title">🛒 Your Shopping Cart</h2>

    <div id="cartItems"></div>

    <div class="total" id="total">Total: ₹0</div>

    <div class="checkout">
      <h2>Customer Details</h2>

      <input
        type="text"
        id="customerName"
        placeholder="Your Name"
        autocomplete="name"
        required>

      <input
        type="tel"
        id="customerPhone"
        placeholder="Mobile Number"
        autocomplete="tel"
        inputmode="numeric"
        required>

      <textarea
        id="customerAddress"
        placeholder="Delivery Address"
        autocomplete="street-address"
        required></textarea>

      <textarea
        id="instructions"
        placeholder="Additional instructions (optional)"></textarea>

      <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">
        Order Through WhatsApp
      </button>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 Foodie Express. All Rights Reserved.</p>
  <p>Fresh Food • Fast Service • Happy Customers</p>
</footer>

<script>

// ===================================
// RESTAURANT SETTINGS
// ===================================

// Replace this with restaurant WhatsApp number.
// Include country code 91. Do not include + or spaces.

const WHATSAPP_NUMBER = "91XXXXXXXXXX";

const CURRENCY = "₹";

// ===================================
// FOOD PRODUCTS
// ===================================

const foods = [
  {
    id: 1,
    name: "Chicken Biryani",
    category: "Biryani",
    price: 150,
    image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=600",
    description: "Delicious chicken biryani."
  },
  {
    id: 2,
    name: "Veg Biryani",
    category: "Biryani",
    price: 110,
    image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=600",
    description: "Fresh vegetable biryani."
  },
  {
    id: 3,
    name: "Chicken Burger",
    category: "Fast Food",
    price: 120,
    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600",
    description: "Crispy chicken burger."
  },
  {
    id: 4,
    name: "Pizza",
    category: "Fast Food",
    price: 180,
    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600",
    description: "Cheesy delicious pizza."
  },
  {
    id: 5,
    name: "Masala Dosa",
    category: "South Indian",
    price: 80,
    image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600",
    description: "Traditional crispy dosa."
  },
  {
    id: 6,
    name: "Idli",
    category: "South Indian",
    price: 40,
    image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600",
    description: "Soft idli with chutney."
  },
  {
    id: 7,
    name: "Fresh Juice",
    category: "Drinks",
    price: 50,
    image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=600",
    description: "Fresh fruit juice."
  },
  {
    id: 8,
    name: "Cold Coffee",
    category: "Drinks",
    price: 70,
    image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600",
    description: "Chilled creamy coffee."
  }
];

// ===================================
// CART STORAGE
// ===================================

let cart = [];

try {
  const savedCart = JSON.parse(
    localStorage.getItem("foodieExpressCart") || "[]"
  );

  if (Array.isArray(savedCart)) {
    cart = savedCart.filter(item =>
      foods.some(food => food.id === item.id) &&
      Number.isInteger(item.quantity) &&
      item.quantity > 0 &&
      item.quantity <= 99
    );
  }
} catch (error) {
  cart = [];
}

let activeCategory = "All";

function saveCart() {
  localStorage.setItem(
    "foodieExpressCart",
    JSON.stringify(cart)
  );
}

// ===================================
// CATEGORY FILTER
// ===================================

function renderCategories() {

  const categories = [
    "All",
    ...new Set(foods.map(food => food.category))
  ];

  document.getElementById("categories").innerHTML =
    categories.map(category => `
      <button
        class="category-btn ${activeCategory === category ? "active" : ""}"
        onclick="selectCategory('${category}')">
        ${category}
      </button>
    `).join("");
}

function selectCategory(category) {
  activeCategory = category;
  renderCategories();
  renderFoods();
}

// ===================================
// DISPLAY FOOD
// ===================================

function renderFoods() {

  const search = document
    .getElementById("search")
    .value.toLowerCase()
    .trim();

  const filtered = foods.filter(food => {

    const matchesCategory =
      activeCategory === "All" ||
      food.category === activeCategory;

    const matchesSearch =
      food.name.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;
  });

  const grid = document.getElementById("foodGrid");

  if (!filtered.length) {
    grid.innerHTML = "<p>No food found.</p>";
    return;
  }

  grid.innerHTML = filtered.map(food => `
    <div class="food-card">

      <img
        src="${food.image}"
        alt="${food.name}"
        loading="lazy">

      <div class="food-info">

        <h3>${food.name}</h3>

        <p>${food.description}</p>

        <div class="food-bottom">

          <span class="price">
            ${CURRENCY}${food.price}
          </span>

          <button
            class="add-btn"
            onclick="addToCart(${food.id})">
            + Add
          </button>

        </div>
      </div>
    </div>
  `).join("");
}

// ===================================
// ADD TO CART
// ===================================

function addToCart(id) {

  const existing = cart.find(item => item.id === id);

  if (existing) {
    if (existing.quantity >= 99) {
      alert("Maximum quantity reached.");
      return;
    }
    existing.quantity++;
  } else {
    cart.push({
      id: id,
      quantity: 1
    });
  }

  saveCart();
  renderCart();
}

// ===================================
// CHANGE QUANTITY
// ===================================

function changeQuantity(id, change) {

  const item = cart.find(item => item.id === id);

  if (!item) return;

  item.quantity += change;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.id !== id);
  }

  if (item.quantity > 99) {
    item.quantity = 99;
  }

  saveCart();
  renderCart();
}

// ===================================
// RENDER CART
// ===================================

function renderCart() {

  const cartItems = document.getElementById("cartItems");

  if (!cart.length) {
    cartItems.innerHTML =
      '<p class="empty">Your cart is empty.</p>';

    document.getElementById("total").textContent =
      "Total: ₹0";

    return;
  }

  let total = 0;

  cartItems.innerHTML = cart.map(item => {

    const food = foods.find(f => f.id === item.id);

    if (!food) return "";

    const subtotal = food.price * item.quantity;

    total += subtotal;

    return `
      <div class="cart-item">

        <div>
          <strong>${food.name}</strong>
          <p class="price">${CURRENCY}${subtotal}</p>
        </div>

        <div class="qty-controls">

          <button onclick="changeQuantity(${food.id}, -1)">
            -
          </button>

          <span>${item.quantity}</span>

          <button onclick="changeQuantity(${food.id}, 1)">
            +
          </button>

        </div>

      </div>
    `;

  }).join("");

  document.getElementById("total").textContent =
    "Total: " + CURRENCY + total;
}

// ===================================
// WHATSAPP ORDER
// ===================================

function sendWhatsAppOrder() {

  const name = document
    .getElementById("customerName")
    .value.trim();

  const phone = document
    .getElementById("customerPhone")
    .value.trim();

  const address = document
    .getElementById("customerAddress")
    .value.trim();

  const instructions = document
    .getElementById("instructions")
    .value.trim();

  if (!cart.length) {
    alert("Please add food to your cart.");
    return;
  }

  if (!name || !phone || !address) {
    alert("Please fill all customer details.");
    return;
  }

  if (!/^[0-9+\-\s()]{7,20}$/.test(phone)) {
    alert("Please enter a valid phone number.");
    return;
  }

  if (!/^\d{10,15}$/.test(WHATSAPP_NUMBER)) {
    alert("Restaurant WhatsApp number is not configured. Please contact the website owner.");
    return;
  }

  let total = 0;

  let message =
    "🍽️ *NEW FOOD ORDER*\n\n";

  message +=
    "*Customer:* " + name + "\n";

  message +=
    "*Phone:* " + phone + "\n";

  message +=
    "*Address:* " + address + "\n\n";

  message += "*ORDER DETAILS*\n";

  cart.forEach(item => {

    const food = foods.find(f => f.id === item.id);

    if (!food) return;

    const subtotal = food.price * item.quantity;

    total += subtotal;

    message +=
      food.name +
      " x " + item.quantity +
      " = ₹" + subtotal + "\n";
  });

  message += "\n*TOTAL: ₹" + total + "*\n";

  if (instructions) {
    message +=
      "\n*Instructions:* " + instructions + "\n";
  }

  message +=
    "\nPlease confirm my order.";

  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);

  window.open(whatsappURL, "_blank", "noopener");

}

// ===================================
// INITIALIZE
// ===================================

renderCategories();
renderFoods();
renderCart();

</script>

</body>
</html>
